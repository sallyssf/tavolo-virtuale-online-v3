<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentiero Selvaggio</title>
<style>
body{margin:0;background:#111;color:#eee;font:14px system-ui;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:74px 1fr 300px;grid-template-rows:1fr 70px;height:100vh}.toolbar{background:#0b0f13;padding:8px;display:flex;flex-direction:column;gap:8px}.tool{background:transparent;color:#eee;border:0;padding:8px;cursor:pointer}.tool.active{background:#26323d;border-radius:8px}.tool span{display:block;font-size:22px}.stage{overflow:hidden;background:#050505;cursor:grab}.stage.dragging{cursor:grabbing}#map{position:absolute;width:900px;height:1350px;background:url('/map.png') center/100% 100%;transform-origin:0 0}.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff35 1px,transparent 1px),linear-gradient(90deg,#ffffff35 1px,transparent 1px);background-size:50px 50px}.fog{position:absolute;inset:0;background:#000d}.hole{position:absolute;border-radius:50%;box-shadow:0 0 0 9999px #000d}.token{position:absolute;width:52px;height:52px;border:3px solid white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:white;cursor:move;z-index:5}.hero{background:#2563eb}.enemy{background:#b91c1c}.npc{background:#a16207}.object{background:#475569}.side{background:#1b222a;padding:14px;overflow:auto;border-left:1px solid #39434d}.top{display:flex;justify-content:space-between}.switch button,.bottom button{background:#26323d;color:#eee;border:1px solid #465361;padding:8px;cursor:pointer}.switch .on{background:#3b82f6}.card{background:#151b21;border:1px solid #39434d;border-radius:8px;padding:10px;margin:7px 0}.row{display:flex;justify-content:space-between}.hp,.connected{color:#86efac}.disconnected{color:#fca5a5}.chat{height:120px;overflow:auto;border:1px solid #39434d;padding:8px}.chatbox{display:flex;gap:5px;margin-top:5px}.chatbox input{flex:1;background:#111;color:white;border:1px solid #39434d;padding:8px}.bottom{grid-column:2/4;background:#0b0f13;border-top:1px solid #39434d;display:flex;gap:10px;align-items:center;padding:10px}.zoom{margin-left:auto}
</style></head><body>
<div class="app"><div class="toolbar"><button class="tool active" data-tool="select"><span>↖</span>Seleziona</button><button class="tool" data-tool="fog"><span>◉</span>Fog of war</button><button class="tool" data-tool="grid"><span>▦</span>Griglia</button><button class="tool" data-tool="reset"><span>↺</span>Reset</button></div>
<div class="stage" id="stage"><div id="map"><div class="grid" id="grid"></div><div class="fog" id="fog"><div class="hole" style="width:230px;height:230px;left:290px;top:410px"></div></div><div id="tokens"></div></div></div>
<aside class="side"><div class="top"><b>Sentiero Selvaggio</b><div class="switch"><button id="dm" class="on">DM</button><button id="player">Giocatore</button></div></div><p id="status" class="disconnected">● Connessione in corso…</p><h3>INIZIATIVA</h3><div id="initiative"></div><button id="endTurn" style="width:100%;padding:10px">FINE TURNO</button><h3>SELEZIONATO</h3><div class="card" id="selected">Nessuna pedina selezionata</div><h3>CHAT</h3><div class="chat" id="chat"></div><div class="chatbox"><input id="msg" placeholder="Scrivi..."><button id="send">➤</button></div></aside>
<div class="bottom"><button id="addHero">+ Eroe</button><button id="addEnemy">+ Mostro</button><button id="addNpc">+ PNG</button><button id="addObj">+ Oggetto</button><span>Stato condiviso via WebSocket</span><div class="zoom">Zoom <input id="zoom" type="range" min="50" max="160" value="85"><b id="zoomVal">85%</b></div></div></div>
<script>
let state={tokens:[{id:"a1",name:"Arannis",type:"hero",hp:19,init:18,x:360,y:470},{id:"a2",name:"Theren",type:"hero",hp:24,init:15,x:420,y:520},{id:"e1",name:"Goblin",type:"enemy",hp:7,init:12,x:650,y:540},{id:"e2",name:"Goblin",type:"enemy",hp:7,init:8,x:720,y:620}],fogHoles:[{x:290,y:410,w:230,h:230}],turn:0};
let ws=null,selected=null,tool="select",scale=.85,pan={x:0,y:0},dragging=false,start={x:0,y:0};
const map=document.getElementById("map"),stage=document.getElementById("stage"),tokens=document.getElementById("tokens"),fog=document.getElementById("fog"),status=document.getElementById("status");
function statusSet(t,ok){status.textContent="● "+t;status.className=ok?"connected":"disconnected"}
function send(type,payload={}){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,...payload}))}
function apply(){map.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`;zoomVal.textContent=Math.round(scale*100)+"%"}
function render(){tokens.innerHTML="";state.tokens.forEach((t,i)=>{let e=document.createElement("div");e.className="token "+t.type;e.textContent=t.type==="enemy"?"G":t.type==="hero"?"E":"?";e.style.left=t.x+"px";e.style.top=t.y+"px";e.dataset.i=i;e.onpointerdown=dragToken;e.onclick=()=>selectToken(i);tokens.appendChild(e)});fog.querySelectorAll(".hole").forEach((e,i)=>{if(i)e.remove()});state.fogHoles.slice(1).forEach(h=>{let e=document.createElement("div");e.className="hole";e.style.cssText=`width:${h.w}px;height:${h.h}px;left:${h.x}px;top:${h.y}px`;fog.appendChild(e)});initiative.innerHTML="";[...state.tokens].sort((a,b)=>b.init-a.init).forEach(t=>{initiative.innerHTML+=`<div class="card row"><span>${t.name}<br><small>${t.type}</small></span><b>${t.init}</b></div>`})}
function selectToken(i){selected=i;let t=state.tokens[i];document.getElementById("selected").innerHTML=`<b>${t.name}</b><br>Tipo: ${t.type}<br>PF: <b class="hp">${t.hp}</b>`}
function dragToken(ev){if(tool!=="select")return;ev.stopPropagation();let i=+ev.currentTarget.dataset.i;selectToken(i);let r=map.getBoundingClientRect(),ox=ev.clientX-r.left-state.tokens[i].x*scale,oy=ev.clientY-r.top-state.tokens[i].y*scale;ev.currentTarget.setPointerCapture(ev.pointerId);ev.currentTarget.onpointermove=e=>{let rr=map.getBoundingClientRect();state.tokens[i].x=(e.clientX-rr.left-ox)/scale;state.tokens[i].y=(e.clientY-rr.top-oy)/scale;ev.currentTarget.style.left=state.tokens[i].x+"px";ev.currentTarget.style.top=state.tokens[i].y+"px";send("token_move",{id:state.tokens[i].id,x:state.tokens[i].x,y:state.tokens[i].y})};ev.currentTarget.onpointerup=()=>{ev.currentTarget.onpointermove=null}}
stage.onpointerdown=e=>{if(e.target.closest(".token"))return;if(tool==="fog"){let r=map.getBoundingClientRect(),x=(e.clientX-r.left)/scale,y=(e.clientY-r.top)/scale,h={x:x-90,y:y-90,w:180,h:180};state.fogHoles.push(h);send("fog_add",{hole:h});render();return}dragging=true;stage.classList.add("dragging");start={x:e.clientX-pan.x,y:e.clientY-pan.y};stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(dragging){pan.x=e.clientX-start.x;pan.y=e.clientY-start.y;apply()}};stage.onpointerup=()=>{dragging=false;stage.classList.remove("dragging")};
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(tool==="grid")grid.style.display=grid.style.display==="none"?"block":"none";if(tool==="reset"){pan={x:0,y:0};scale=.85;zoom.value=85;apply()}});
zoom.oninput=e=>{scale=e.target.value/100;apply()};
function add(type,name){send("add_token",{token:{id:Math.random().toString(36).slice(2),name,type,hp:type==="enemy"?8:20,init:Math.floor(Math.random()*18)+1,x:350+Math.random()*250,y:500+Math.random()*300}})}
addHero.onclick=()=>add("hero","Nuovo Eroe");addEnemy.onclick=()=>add("enemy","Nuovo Mostro");addNpc.onclick=()=>add("npc","Nuovo PNG");addObj.onclick=()=>add("object","Oggetto");
function sendChat(){let t=msg.value.trim();if(t){send("chat",{message:t});msg.value=""}}send.onclick=sendChat;msg.onkeydown=e=>{if(e.key==="Enter")sendChat()};endTurn.onclick=()=>send("turn_end");
function connect(){const url=(location.protocol==="https:"?"wss://":"ws://")+location.host;statusSet("Connessione in corso…",false);ws=new WebSocket(url);ws.onopen=()=>{statusSet("Connesso",true);send("join")};ws.onclose=()=>{statusSet("Disconnesso — riconnessione…",false);setTimeout(connect,2500)};ws.onerror=()=>statusSet("Errore WebSocket",false);ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="state"){state=m.state;render()}if(m.type==="chat"){chat.innerHTML+=`<p><b>${m.from}:</b> ${m.message}</p>`}if(m.type==="system"){chat.innerHTML+=`<p><b>Sistema:</b> ${m.message}</p>`}}}
render();apply();connect();
</script></body></html>
